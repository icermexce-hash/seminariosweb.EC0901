<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seminario en vivo</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:10px}
  /* El ancho se limita según el alto de la pantalla para que video + mensaje/CTA siempre quepan sin hacer scroll */
  .wrap{width:100%;max-width:min(1400px, calc((100vh - 150px) * 16 / 9));max-width:min(1400px, calc((100dvh - 150px) * 16 / 9));min-width:280px}
  .player{background:#0b0b0b;border:1px solid #1e1e1e;border-radius:10px;overflow:hidden}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#0d0d0d;border-bottom:1px solid #1a1a1a;font-size:13px}
  .live{display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:#e53935;animation:pulse 1.4s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .badge{background:#c62828;color:#fff;font-size:9px;font-weight:700;padding:3px 8px;border-radius:10px;letter-spacing:.5px}
  .viewers{display:flex;align-items:center;gap:6px;border:1px solid #2a2a2a;border-radius:20px;padding:5px 12px;font-size:12px}
  .viewers b{font-weight:700}
  .viewers span{color:#777}
  .stage{position:relative;aspect-ratio:16/9;background:#000}
  video{width:100%;height:100%;display:block;background:#000;pointer-events:none;object-fit:contain}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);z-index:2}
  .join{background:#0a58d6;color:#fff;border:0;border-radius:30px;padding:15px 32px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 0 28px rgba(10,88,214,.55);transition:transform .15s,background .15s}
  .join:hover{background:#0d6efd;transform:scale(1.04)}
  .hint{font-size:11px;color:#9a9a9a}
  .fs{position:absolute;right:12px;bottom:12px;z-index:3;background:rgba(0,0,0,.6);color:#fff;border:1px solid #333;border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer;display:none}
  .fs:hover{background:rgba(255,255,255,.2)}
  .stage.playing .fs{display:block}
  .stage:fullscreen{aspect-ratio:auto;width:100vw;height:100vh}
  .stage:-webkit-full-screen{aspect-ratio:auto;width:100vw;height:100vh}
  .note{text-align:center;color:#9a9a9a;font-size:13px;line-height:1.3;margin-top:12px}
  .hidden{display:none!important}
  .cta-box{text-align:center;margin-top:12px}
  .cta{display:inline-block;background:#e53935;color:#fff;text-decoration:none;font-size:19px;font-weight:800;padding:13px 40px;border-radius:40px;box-shadow:0 0 30px rgba(229,57,53,.5);animation:pop .6s ease, glow 1.8s infinite 0.6s}
  @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes glow{50%{box-shadow:0 0 44px rgba(229,57,53,.85)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="player">
    <div class="bar">
      <div class="live"><span class="dot"></span><span>Seminario en vivo</span><span class="badge">● EN VIVO</span></div>
      <div class="viewers">👁 <b id="count">125</b><span>espectadores</span></div>
    </div>
    <div class="stage" id="stage">
      <video id="video" playsinline webkit-playsinline preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate noremoteplayback" src="https://assets.cdn.filesafe.space/VznavX09KpvBJgolGTCj/media/6abd2874b54f11872a4d024c.mp4"></video>
      <button class="fs" id="fs" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
      <div class="overlay" id="overlay">
        <button class="join" id="join">🎤 Unirme a la plática</button>
        <div class="hint">Haz clic para activar el sonido y unirte</div>
      </div>
    </div>
  </div>

  <p class="note" id="note">⏱️ La sesión finaliza automáticamente · No se puede pausar ni adelantar</p>

  <div class="cta-box hidden" id="ctaBox">
    <a class="cta" id="cta" href="#">¡Inscríbete hoy!</a>
  </div>
</div>

<script>
  // ====== CONFIGURACIÓN ======
  const CTA_URL = "https://TU-URL-AQUI.com"; // <-- cambia esta URL
  const MIN_VIEWERS = 100;
  const MAX_VIEWERS = 150;
  // ===========================

  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');
  const joinBtn = document.getElementById('join');
  const ctaBox = document.getElementById('ctaBox');
  const cta = document.getElementById('cta');
  const countEl = document.getElementById('count');
  const stage = document.getElementById('stage');
  const fsBtn = document.getElementById('fs');

  cta.href = CTA_URL;

  // --- Espectadores (fluctúa entre 100 y 150) ---
  let viewers = 100 + Math.floor(Math.random()*51);
  let viewersTimer;
  function tickViewers(){
    const step = Math.floor(Math.random()*9) - 4;       // -4 a +4
    viewers = Math.min(MAX_VIEWERS, Math.max(MIN_VIEWERS, viewers + step));
    if (viewers === MAX_VIEWERS) viewers -= 1;
    if (viewers === MIN_VIEWERS) viewers += 1;
    countEl.textContent = viewers;
    viewersTimer = setTimeout(tickViewers, 20000);
  }
  tickViewers();

  // --- Unirse: reproduce con sonido ---
  joinBtn.addEventListener('click', () => {
    if (ended) return;
    stage.classList.add('playing');
    overlay.classList.add('hidden');
    video.muted = false;
    video.volume = 1;
    video.play().catch(() => {});
  });

  // --- Sin pausa ni adelantar/retroceder ---
  let started = false, ended = false, lastTime = 0;
  video.addEventListener('playing', () => started = true);
  video.addEventListener('pause', () => {
    if (started && !ended) video.play().catch(() => {});
  });
  video.addEventListener('timeupdate', () => {
    if (!video.seeking) lastTime = video.currentTime;
  });
  video.addEventListener('seeking', () => {
    if (!ended && Math.abs(video.currentTime - lastTime) > 0.5) video.currentTime = lastTime;
  });
  video.addEventListener('ratechange', () => { video.playbackRate = 1; });
  video.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if (started && !ended && [' ', 'k', 'ArrowLeft', 'ArrowRight', 'MediaPlayPause'].includes(e.key)) e.preventDefault();
  });
  // Si la pestaña vuelve a estar visible, reanuda
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && started && !ended) video.play().catch(() => {});
  });

  // --- Al terminar: mostrar CTA ---
  video.addEventListener('ended', () => {
    ended = true;
    clearTimeout(viewersTimer); // el contador se queda fijo en el número actual
    document.getElementById('note').classList.add('hidden');
    ctaBox.classList.remove('hidden');
  });

  // --- Pantalla completa ---
  function isFs(){ return document.fullscreenElement || document.webkitFullscreenElement; }
  fsBtn.addEventListener('click', () => {
    if (isFs()) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else if (stage.requestFullscreen) {
      stage.requestFullscreen().catch(() => {});
    } else if (stage.webkitRequestFullscreen) {
      stage.webkitRequestFullscreen();
    } else if (video.webkitEnterFullscreen) {   // iPhone
      video.webkitEnterFullscreen();
    }
  });

  // --- Al terminar: no se puede volver a reproducir ---
  video.loop = false;
  video.addEventListener('play', () => { if (ended) { video.pause(); } });
  video.addEventListener('ended', () => {
    if (isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    fsBtn.classList.add('hidden');
    joinBtn.disabled = true;
  });
</script>
</body>
</html>
